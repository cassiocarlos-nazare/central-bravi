<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horas · Drive — Central Bravi</title>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #0f1117;
  --bg2:       #181c27;
  --bg3:       #1e2334;
  --border:    #2a3049;
  --accent:    #4f8ef7;
  --accent2:   #7c3aed;
  --green:     #22c55e;
  --yellow:    #f59e0b;
  --red:       #ef4444;
  --text:      #e8eaf0;
  --text2:     #8892a4;
  --text3:     #4f5a70;
  --radius:    8px;
  --shadow:    0 2px 12px rgba(0,0,0,.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── LAYOUT ──────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 52px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.topbar-logo { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
.topbar-title { font-size: 13px; color: var(--text2); }
.topbar-sep { color: var(--text3); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.nav-tabs {
  display: flex; gap: 2px;
  padding: 0 20px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.nav-tab {
  padding: 10px 16px; font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; transition: all .15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.main { flex: 1; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }

/* ── FILTROS ─────────────────────────────────────────────── */
.filters-bar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
}
.filter-group { display: flex; align-items: center; gap: 6px; }
.filter-label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
select, input[type=text] {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 5px 10px;
  font-size: 13px; outline: none; transition: border-color .15s;
}
select:focus, input[type=text]:focus { border-color: var(--accent); }
.filters-sep { width: 1px; height: 20px; background: var(--border); }

/* ── CARDS ───────────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
}
.card-label { font-size: 11px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.card-value { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
.card-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
.card-bar { height: 4px; border-radius: 2px; background: var(--bg3); margin-top: 10px; overflow: hidden; }
.card-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .4s; }
.card-bar-fill.green  { background: var(--green); }
.card-bar-fill.yellow { background: var(--yellow); }
.card-bar-fill.red    { background: var(--red); }

/* ── CHARTS ROW ──────────────────────────────────────────── */
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
@media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }

.panel {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
}
.panel-title {
  font-size: 12px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px;
}

/* Barras de gráfico customizadas */
.chart-bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 12px; color: var(--text2); width: 80px; text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 18px; background: var(--bg3); border-radius: 3px; overflow: hidden; position: relative; }
.bar-fill  { height: 100%; border-radius: 3px; background: var(--accent); transition: width .5s; min-width: 2px; }
.bar-fill.green  { background: var(--green); }
.bar-fill.yellow { background: var(--yellow); }
.bar-fill.accent2{ background: var(--accent2); }
.bar-value { font-size: 12px; color: var(--text2); width: 48px; flex-shrink: 0; }

/* ── TABELA CONFERÊNCIA ──────────────────────────────────── */
.conf-controls {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.btn {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: var(--bg3);
  color: var(--text2); transition: all .15s;
}
.btn:hover { background: var(--bg2); color: var(--text); }
.btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-icon { padding: 6px 10px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .85; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.periodo-nav { display: flex; align-items: center; gap: 6px; }
.periodo-label { font-size: 13px; color: var(--text); font-weight: 600; min-width: 180px; text-align: center; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  padding: 8px 10px; text-align: left;
  font-size: 11px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--border);
  background: var(--bg2); position: sticky; top: 0; z-index: 1;
}
td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg3); }

.chip {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.chip-green  { background: rgba(34,197,94,.15);  color: var(--green); }
.chip-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
.chip-red    { background: rgba(239,68,68,.15);  color: var(--red); }
.chip-blue   { background: rgba(79,142,247,.15); color: var(--accent); }
.chip-gray   { background: rgba(255,255,255,.07); color: var(--text2); }

.horas-cell { font-weight: 600; }
.horas-ok   { color: var(--green); }
.horas-warn { color: var(--yellow); }
.horas-crit { color: var(--red); }
.horas-zero { color: var(--text3); }

/* ── DRILL DOWN ──────────────────────────────────────────── */
.drill {
  display: none; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); margin: 4px 0 8px 0; padding: 16px;
}
.drill.open { display: block; }
.drill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
@media (max-width: 700px) { .drill-grid { grid-template-columns: 1fr; } }
.drill-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }

/* ── RANKING TABLE ───────────────────────────────────────── */
.rank-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.rank-row:last-child { border-bottom: none; }
.rank-num  { font-size: 12px; color: var(--text3); width: 20px; text-align: right; }
.rank-name { flex: 1; font-size: 13px; color: var(--text); }
.rank-role { font-size: 11px; color: var(--text2); }
.rank-hrs  { font-size: 13px; font-weight: 600; color: var(--accent); width: 60px; text-align: right; }
.rank-bar-wrap { width: 80px; }
.rank-bar  { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

/* ── MODAL ───────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 500; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; width: 520px; max-width: 95vw;
  max-height: 85vh; overflow-y: auto;
}
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.equipe-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 6px; margin-bottom: 4px;
  background: var(--bg3); border: 1px solid var(--border);
}
.equipe-nome { flex: 1; font-size: 13px; font-weight: 600; }
.equipe-membros { font-size: 12px; color: var(--text2); }
.equipe-actions { display: flex; gap: 4px; }

input[type=text].input-full { width: 100%; padding: 7px 10px; margin-bottom: 8px; }
.member-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.member-chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 10px; font-size: 12px;
}
.member-chip button { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 14px; line-height: 1; }
.member-chip button:hover { color: var(--red); }

/* ── LOADING / EMPTY ─────────────────────────────────────── */
.loading {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 48px; color: var(--text2); font-size: 14px;
}
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 48px; color: var(--text2); }
.empty-icon { font-size: 32px; margin-bottom: 8px; }

.badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff; border-radius: 20px;
  font-size: 10px; font-weight: 700; padding: 1px 6px; margin-left: 4px;
}

/* ── TOAST ───────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 16px;
  font-size: 13px; color: var(--text); box-shadow: var(--shadow);
  opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

/* ── SEÇÃO VISÍVEL ───────────────────────────────────────── */
.section { display: none; }
.section.active { display: block; }

.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.section-title { font-size: 16px; font-weight: 700; }
.section-sub   { font-size: 13px; color: var(--text2); margin-top: 2px; }
</style>
</head>
<body>
<div class="app">

<!-- TOPBAR -->
<div class="topbar">
  <span class="topbar-logo">BRAVI</span>
  <span class="topbar-sep">/</span>
  <span class="topbar-title">Controle de Horas · Drive</span>
  <div class="topbar-right">
    <button class="btn btn-sm" id="btnEquipes" onclick="abrirModalEquipes()">⚙ Equipes</button>
    <button class="btn btn-sm btn-primary" id="btnSync" onclick="carregarTudo()">↻ Sincronizar</button>
  </div>
</div>

<!-- ABAS -->
<div class="nav-tabs">
  <button class="nav-tab active" onclick="trocarAba('dashboard')">Dashboard</button>
  <button class="nav-tab" onclick="trocarAba('semanal')">Conferência Semanal</button>
  <button class="nav-tab" onclick="trocarAba('quinzenal')">Conferência Quinzenal</button>
</div>

<!-- FILTROS GLOBAIS -->
<div style="padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);">
  <div class="filters-bar" style="margin-bottom:0">
    <div class="filter-group">
      <span class="filter-label">Mês</span>
      <select id="filtroMes" onchange="onFiltroMudou()"></select>
      <select id="filtroAno" onchange="onFiltroMudou()">
        <option value="2026">2026</option>
      </select>
    </div>
    <div class="filters-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Role</span>
      <select id="filtroRole" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Level</span>
      <select id="filtroLevel" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Equipe</span>
      <select id="filtroEquipe" onchange="aplicarFiltros()">
        <option value="">Todas</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Projeto</span>
      <select id="filtroProjeto" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Status</span>
      <select id="filtroAtivo" onchange="aplicarFiltros()">
        <option value="1">Ativos</option>
        <option value="">Todos</option>
        <option value="0">Inativos</option>
      </select>
    </div>
  </div>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="main">

  <!-- ══ DASHBOARD ══════════════════════════════════════════ -->
  <div id="sec-dashboard" class="section active">
    <div class="section-header">
      <div>
        <div class="section-title" id="dashTitle">Dashboard — Junho 2026</div>
        <div class="section-sub" id="dashSub">Carregando...</div>
      </div>
    </div>

    <div id="dashLoading" class="loading"><div class="spinner"></div> Carregando dados...</div>

    <div id="dashContent" style="display:none">
      <!-- CARDS -->
      <div class="cards-grid" id="cardsGrid"></div>

      <!-- GRÁFICOS -->
      <div class="charts-row">
        <div class="panel">
          <div class="panel-title">Horas por Semana</div>
          <div class="chart-bars" id="chartSemanas"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Horas por Projeto (Top 10)</div>
          <div class="chart-bars" id="chartProjetos"></div>
        </div>
      </div>

      <!-- RANKING -->
      <div class="panel">
        <div class="panel-title">Ranking de Profissionais</div>
        <div id="rankingLista"></div>
      </div>
    </div>
  </div>

  <!-- ══ SEMANAL ════════════════════════════════════════════ -->
  <div id="sec-semanal" class="section">
    <div class="conf-controls">
      <div class="periodo-nav">
        <button class="btn btn-icon" onclick="navSemana(-1)">‹</button>
        <span class="periodo-label" id="labelSemana"></span>
        <button class="btn btn-icon" onclick="navSemana(1)">›</button>
      </div>
      <button class="btn" onclick="irSemanaAtual()">Semana atual</button>
      <button class="btn" onclick="irSemanaAnterior()">Semana anterior</button>
    </div>
    <div class="panel">
      <div id="tabSemanalWrap">
        <div class="loading"><div class="spinner"></div> Carregando...</div>
      </div>
    </div>
  </div>

  <!-- ══ QUINZENAL ══════════════════════════════════════════ -->
  <div id="sec-quinzenal" class="section">
    <div class="conf-controls">
      <div class="periodo-nav">
        <button class="btn btn-icon" onclick="navQuinzena(-1)">‹</button>
        <span class="periodo-label" id="labelQuinzena"></span>
        <button class="btn btn-icon" onclick="navQuinzena(1)">›</button>
      </div>
      <button class="btn" onclick="irQuinzenaAtual()">Quinzena atual</button>
    </div>
    <div class="panel">
      <div id="tabQuinzenalWrap">
        <div class="loading"><div class="spinner"></div> Carregando...</div>
      </div>
    </div>
  </div>

</div><!-- /main -->
</div><!-- /app -->

<!-- MODAL EQUIPES -->
<div class="modal-overlay" id="modalEquipes">
  <div class="modal">
    <div class="modal-title">⚙ Gerenciar Equipes</div>
    <div id="equipesLista"></div>
    <hr style="border-color:var(--border);margin:14px 0">
    <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600">NOVA EQUIPE</div>
    <input type="text" class="input-full" id="novaEquipeNome" placeholder="Nome da equipe">
    <div style="font-size:12px;color:var(--text2);margin-bottom:6px">Membros:</div>
    <div class="member-chips" id="novaEquipeMembros"></div>
    <select id="novaEquipePessoaSelect" style="width:100%;margin-bottom:6px" onchange="adicionarMembroNova()">
      <option value="">— Adicionar pessoa —</option>
    </select>
    <div class="modal-footer">
      <button class="btn" onclick="fecharModalEquipes()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarNovaEquipe()">Criar Equipe</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbwflnR51V4sh7cc99AgHD9cJkfgE6BK38Xkcjaket0rfGy0HArMnTOHpQbGFhuwL6HD/exec';
const LS_HORAS   = 'bravi_horas_drive';
const LS_PESSOAS = 'bravi_pessoas_drive';
const LS_EQUIPES = 'bravi_equipes_drive';

const FERIADOS = ['2026-01-01','2026-02-16','2026-02-17','2026-04-03','2026-04-21',
  '2026-05-01','2026-06-04','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-12-25'];

const MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// ══════════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════════════
let DB = {
  horas:   [],   // todos os lançamentos do mês carregado
  pessoas: [],   // profissionais da planilha
  equipes: [],   // equipes (localStorage)
  mesAtual: new Date().getMonth() + 1,
  anoAtual: new Date().getFullYear(),
};
let horasFiltradas = [];
let pessoasFiltradas = [];
let offsetSemana = 0;
let offsetQuinzena = 0;
let abaAtiva = 'dashboard';

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  preencherFiltroMes();
  DB.equipes = carregarEquipes();
  carregarTudo();
});

function preencherFiltroMes() {
  const sel = document.getElementById('filtroMes');
  sel.innerHTML = '';
  MESES_NOMES.forEach((nome, i) => {
    const opt = document.createElement('option');
    opt.value = i + 1;
    opt.textContent = nome;
    if (i + 1 === DB.mesAtual) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ══════════════════════════════════════════════════════════════
// CARGA DE DADOS
// ══════════════════════════════════════════════════════════════
async function carregarTudo() {
  const btn = document.getElementById('btnSync');
  btn.textContent = '↻ Sincronizando...';
  btn.disabled = true;

  const mes = parseInt(document.getElementById('filtroMes').value);
  const ano = parseInt(document.getElementById('filtroAno').value);
  DB.mesAtual = mes; DB.anoAtual = ano;

  try {
    // Carrega em paralelo
    const [resHoras, resPessoas] = await Promise.all([
      fetch(`${API_URL}?action=horas-drive&mes=${mes}&ano=${ano}&modo=mes`).then(r => r.json()),
      fetch(`${API_URL}?action=pessoas-drive&ano=${ano}`).then(r => r.json())
    ]);

    if (resHoras.ok)   { DB.horas   = resHoras.dados   || []; salvarLS(LS_HORAS,   DB.horas); }
    else { DB.horas = carregarLS(LS_HORAS) || []; }

    if (resPessoas.ok) { DB.pessoas = resPessoas.dados || []; salvarLS(LS_PESSOAS, DB.pessoas); }
    else { DB.pessoas = carregarLS(LS_PESSOAS) || []; }

    popularFiltros();
    aplicarFiltros();
    toast(`✓ ${DB.horas.length} lançamentos carregados`);
  } catch(e) {
    // Fallback para cache
    DB.horas   = carregarLS(LS_HORAS)   || [];
    DB.pessoas = carregarLS(LS_PESSOAS) || [];
    popularFiltros();
    aplicarFiltros();
    toast('⚠ Usando cache local', 'warn');
  } finally {
    btn.textContent = '↻ Sincronizar';
    btn.disabled = false;
  }
}

function onFiltroMudou() {
  carregarTudo();
}

// ══════════════════════════════════════════════════════════════
// FILTROS
// ══════════════════════════════════════════════════════════════
function popularFiltros() {
  // Roles
  popularSelect('filtroRole', [...new Set(DB.pessoas.map(p => p.role).filter(Boolean))].sort());
  // Levels
  popularSelect('filtroLevel', [...new Set(DB.pessoas.map(p => p.level).filter(Boolean))].sort());
  // Projetos
  popularSelect('filtroProjeto', [...new Set(DB.horas.map(h => h.projeto).filter(Boolean))].sort());
  // Equipes
  const selEq = document.getElementById('filtroEquipe');
  selEq.innerHTML = '<option value="">Todas</option>';
  DB.equipes.forEach(eq => {
    const opt = document.createElement('option');
    opt.value = eq.id;
    opt.textContent = eq.nome;
    selEq.appendChild(opt);
  });
}

function popularSelect(id, items) {
  const sel = document.getElementById(id);
  const val = sel.value;
  sel.innerHTML = '<option value="">Todos</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item; opt.textContent = item;
    if (item === val) opt.selected = true;
    sel.appendChild(opt);
  });
}

function aplicarFiltros() {
  const role   = document.getElementById('filtroRole').value;
  const level  = document.getElementById('filtroLevel').value;
  const equipe = document.getElementById('filtroEquipe').value;
  const proj   = document.getElementById('filtroProjeto').value;
  const ativo  = document.getElementById('filtroAtivo').value;

  // Filtra pessoas
  let pessoas = DB.pessoas;
  if (role)   pessoas = pessoas.filter(p => p.role  === role);
  if (level)  pessoas = pessoas.filter(p => p.level === level);
  if (ativo !== '') pessoas = pessoas.filter(p => String(p.ativo ? '1' : '0') === ativo);
  if (equipe) {
    const eq = DB.equipes.find(e => e.id === equipe);
    if (eq) pessoas = pessoas.filter(p => eq.membros.includes(p.people));
  }
  pessoasFiltradas = pessoas;

  // Filtra horas
  const userSet = new Set(pessoas.map(p => p.people));
  let horas = DB.horas.filter(h => userSet.has(h.user));
  if (proj) horas = horas.filter(h => h.projeto === proj);
  horasFiltradas = horas;

  renderizarAba();
}

function renderDashboard() {
  const loading = document.getElementById('dashLoading');

  content.style.display = 'block';

  const mes = DB.mesAtual; const ano = DB.anoAtual;
  document.getElementById('dashTitle').textContent =
    `Dashboard — ${MESES_NOMES[mes-1]} ${ano}`;

  const totalHoras     = horasFiltradas.reduce((a,h) => a + (h.horas||0), 0);
  const totalBilaveis  = horasFiltradas.reduce((a,h) => a + (h.horasBilaveis||0), 0);
  const totalInternas  = horasFiltradas.reduce((a,h) => a + (h.horasInternas||0), 0);
  const totalNaoBil    = horasFiltradas.reduce((a,h) => a + (h.horasNaoBil||0), 0);
  const duMes          = diasUteisMes(ano, mes);
  const metaMes        = pessoasFiltradas.filter(p => p.ativo).length * duMes * 8;
  const pctMeta        = metaMes > 0 ? Math.round((totalHoras / metaMes) * 100) : 0;
  const pctBil         = totalHoras > 0 ? Math.round((totalBilaveis / totalHoras) * 100) : 0;

  document.getElementById('dashSub').textContent =
    `${pessoasFiltradas.filter(p=>p.ativo).length} profissionais ativos · ${duMes} dias úteis · Meta: ${fmtH(metaMes)}`;

  // CARDS
  document.getElementById('cardsGrid').innerHTML = `
    ${card('Total de Horas', fmtH(totalHoras), `Meta: ${fmtH(metaMes)}`, pctMeta, corPct(pctMeta))}
    ${card('Horas Billáveis', fmtH(totalBilaveis), `${pctBil}% do total`, pctBil, 'green')}
    ${card('Horas Internas', fmtH(totalInternas), `${totalHoras>0?Math.round(totalInternas/totalHoras*100):0}% do total`, null, null)}
    ${card('Horas Não Billáveis', fmtH(totalNaoBil), `${totalHoras>0?Math.round(totalNaoBil/totalHoras*100):0}% do total`, null, null)}
    ${card('Meta Mensal', pctMeta + '%', `${fmtH(totalHoras)} de ${fmtH(metaMes)}`, pctMeta, corPct(pctMeta))}
    ${card('Profissionais', pessoasFiltradas.filter(p=>p.ativo).length, `${pessoasFiltradas.length} no filtro`, null, null)}
  `;

  // GRÁFICO SEMANAS
  const porSemana = {};
  horasFiltradas.forEach(h => {
    const s = h.semana || semanaISO(h.data);
    if (!porSemana[s]) porSemana[s] = 0;
    porSemana[s] += h.horas || 0;
  });
  const semanas = Object.entries(porSemana).sort((a,b) => a[0]-b[0]);
  const maxSem  = Math.max(...semanas.map(s => s[1]), 1);
  document.getElementById('chartSemanas').innerHTML = semanas.map(([s, h]) =>
    barRow(`Sem ${s}`, h, maxSem, 'accent')
  ).join('') || '<div class="empty">Sem dados</div>';

  // GRÁFICO PROJETOS
  const porProj = {};
  horasFiltradas.forEach(h => {
    if (!h.projeto) return;
    porProj[h.projeto] = (porProj[h.projeto] || 0) + (h.horas || 0);
  });
  const projTop = Object.entries(porProj).sort((a,b) => b[1]-a[1]).slice(0,10);
  const maxProj = Math.max(...projTop.map(p => p[1]), 1);
  document.getElementById('chartProjetos').innerHTML = projTop.map(([p, h]) =>
    barRow(p.length > 18 ? p.substring(0,18)+'…' : p, h, maxProj, 'accent2')
  ).join('') || '<div class="empty">Sem dados</div>';

  // RANKING
  const porUser = {};
  horasFiltradas.forEach(h => {
    if (!h.user) return;
    porUser[h.user] = (porUser[h.user] || 0) + (h.horas || 0);
  });
  const ranking = Object.entries(porUser).sort((a,b) => b[1]-a[1]);
  const maxH = Math.max(...ranking.map(r => r[1]), 1);
  document.getElementById('rankingLista').innerHTML = ranking.map(([user, h], i) => {
    const pessoa = DB.pessoas.find(p => p.people === user);
    const pct = Math.round(h / maxH * 100);
    return `<div class="rank-row">
      <span class="rank-num">${i+1}</span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="rank-name">${nomeFormatado(user)}</span>
          ${pessoa ? `<span class="chip chip-gray" style="font-size:10px">${pessoa.role||''}</span>` : ''}
          ${pessoa ? `<span class="chip chip-blue" style="font-size:10px">${pessoa.level||''}</span>` : ''}
        </div>
        <div class="rank-bar"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <span class="rank-hrs">${fmtH(h)}</span>
    </div>`;
  }).join('') || '<div class="empty">Sem dados</div>';
}

function card(label, value, sub, pct, cor) {
  const barHtml = pct !== null ? `
    <div class="card-bar">
      <div class="card-bar-fill ${cor||''}" style="width:${Math.min(pct,100)}%"></div>
    </div>` : '';
  return `<div class="card">
    <div class="card-label">${label}</div>
    <div class="card-value">${value}</div>
    <div class="card-sub">${sub}</div>
    ${barHtml}
  </div>`;
}

function barRow(label, valor, max, cor) {
  const pct = max > 0 ? Math.round(valor / max * 100) : 0;
  return `<div class="bar-row">
    <span class="bar-label" title="${label}">${label}</span>
    <div class="bar-track"><div class="bar-fill ${cor}" style="width:${pct}%"></div></div>
    <span class="bar-value">${fmtH(valor)}</span>
  </div>`;
}

// CONFERÊNCIA SEMANAL
// ══════════════════════════════════════════════════════════════
function renderSemanal() {
  const { ini, fim } = periodoSemana(offsetSemana);
  document.getElementById('labelSemana').textContent =
    `${fmtData(ini)} — ${fmtData(fim)}`;
  renderTabConferencia('tabSemanalWrap', ini, fim, 40);
}

function navSemana(d) { offsetSemana += d; renderSemanal(); }
function irSemanaAtual()    { offsetSemana = 0; renderSemanal(); }
function irSemanaAnterior() { offsetSemana = -1; renderSemanal(); }

function periodoSemana(offset) {
  const hoje = new Date();
  const dow  = hoje.getDay() === 0 ? 7 : hoje.getDay();
  const seg  = new Date(hoje); seg.setDate(hoje.getDate() - dow + 1 + offset * 7);
  const sex  = new Date(seg);  sex.setDate(seg.getDate() + 4);
  return { ini: seg, fim: sex };
}

// ══════════════════════════════════════════════════════════════
// CONFERÊNCIA QUINZENAL
// ══════════════════════════════════════════════════════════════
function renderQuinzenal() {
  const { ini, fim } = periodoQuinzena(offsetQuinzena);
  document.getElementById('labelQuinzena').textContent =
    `${fmtData(ini)} — ${fmtData(fim)}`;
  renderTabConferencia('tabQuinzenalWrap', ini, fim, 80);
}

function navQuinzena(d) { offsetQuinzena += d; renderQuinzenal(); }
function irQuinzenaAtual() { offsetQuinzena = 0; renderQuinzenal(); }

function periodoQuinzena(offset) {
  const hoje = new Date();
  const ano  = hoje.getFullYear();
  const mes  = hoje.getMonth();
  // Quinzena 1: 1-15, Quinzena 2: 16-último
  let q, m, a;
  if (hoje.getDate() <= 15) {
    q = 0; // primeira quinzena do mês atual
  } else {
    q = 1; // segunda quinzena do mês atual
  }
  q += offset;
  // Normaliza
  let qMes = mes + Math.floor(q / 2);
  let qQ   = ((q % 2) + 2) % 2;
  let qAno = ano + Math.floor(qMes / 12);
  qMes = ((qMes % 12) + 12) % 12;

  let ini, fim;
  if (qQ === 0) {
    ini = new Date(qAno, qMes, 1);
    fim = new Date(qAno, qMes, 15);
  } else {
    ini = new Date(qAno, qMes, 16);
    fim = new Date(qAno, qMes + 1, 0);
  }
  return { ini, fim };
}

// ══════════════════════════════════════════════════════════════
// TABELA DE CONFERÊNCIA (compartilhada semanal/quinzenal)
// ══════════════════════════════════════════════════════════════
function renderTabConferencia(wrapId, ini, fim, metaHoras) {
  const wrap = document.getElementById(wrapId);

  // Dias úteis no período
  const dias = [];
  for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) {
    const dow = d.getDay();
    if (dow > 0 && dow < 6) dias.push(fmtISO(d));
  }

  // Horas por user × dia
  const iniISO = fmtISO(ini); const fimISO = fmtISO(fim);
  const porUserDia = {};
  horasFiltradas.forEach(h => {
    if (!h.data || h.data < iniISO || h.data > fimISO) return;
    if (!porUserDia[h.user]) porUserDia[h.user] = {};
    porUserDia[h.user][h.data] = (porUserDia[h.user][h.data] || 0) + (h.horas || 0);
  });

  // Pessoas ativas filtradas
  const pessoas = pessoasFiltradas.filter(p => p.ativo);

  if (!pessoas.length) {
    wrap.innerHTML = '<div class="empty"><div class="empty-icon">👥</div>Nenhum profissional no filtro</div>';
    return;
  }

  // Cabeçalho
  const thDias = dias.map(d => {
    const dt = new Date(d + 'T12:00:00');
    const dow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'][dt.getDay()];
    return `<th style="text-align:center;min-width:52px">${dow}<br><span style="font-weight:400;color:var(--text3)">${dt.getDate()}</span></th>`;
  }).join('');

  // Linhas
  const linhas = pessoas.map(p => {
    const userData = porUserDia[p.people] || {};
    const totalH   = dias.reduce((a, d) => a + (userData[d] || 0), 0);
    const cor = totalH >= metaHoras ? 'horas-ok' : totalH >= metaHoras * 0.75 ? 'horas-warn' : totalH > 0 ? 'horas-crit' : 'horas-zero';

    const celulas = dias.map(d => {
      const h = userData[d] || 0;
      const c = h >= 8 ? 'horas-ok' : h >= 4 ? 'horas-warn' : h > 0 ? 'horas-crit' : 'horas-zero';
      return `<td style="text-align:center" class="${c}">${h > 0 ? fmtH1d(h) : '—'}</td>`;
    }).join('');

    const nivel = p.level ? `<span class="chip chip-blue" style="font-size:10px;margin-left:4px">${p.level}</span>` : '';

    return `<tr style="cursor:pointer" onclick="toggleDrill('${p.people}','${iniISO}','${fimISO}')">
      <td style="white-space:nowrap">
        ${nomeFormatado(p.people)}${nivel}
        <div style="font-size:11px;color:var(--text3)">${p.role||''}</div>
      </td>
      ${celulas}
      <td style="text-align:right" class="horas-cell ${cor}">${fmtH(totalH)}</td>
      <td style="text-align:center">${chipMeta(totalH, metaHoras)}</td>
    </tr>
    <tr><td colspan="${dias.length + 3}" style="padding:0">
      <div class="drill" id="drill-${p.people.replace(/\./g,'_')}">
        ${renderDrill(p, iniISO, fimISO)}
      </div>
    </td></tr>`;
  }).join('');

  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>
      <th style="min-width:160px">Profissional</th>
      ${thDias}
      <th style="text-align:right">Total</th>
      <th style="text-align:center">Meta</th>
    </tr></thead>
    <tbody>${linhas}</tbody>
  </table></div>`;
}

function toggleDrill(people, ini, fim) {
  const id = 'drill-' + people.replace(/\./g,'_');
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function renderDrill(pessoa, ini, fim) {
  const horasPessoa = horasFiltradas.filter(h => h.user === pessoa.people && h.data >= ini && h.data <= fim);
  const totalH = horasPessoa.reduce((a,h) => a + (h.horas||0), 0);

  // Por projeto
  const porProj = {};
  horasPessoa.forEach(h => {
    porProj[h.projeto] = (porProj[h.projeto]||0) + (h.horas||0);
  });
  const projRows = Object.entries(porProj).sort((a,b)=>b[1]-a[1])
    .map(([p,h]) => `<div class="bar-row">
      <span class="bar-label" title="${p}" style="width:120px">${p.length>18?p.substring(0,18)+'…':p}</span>
      <div class="bar-track"><div class="bar-fill accent" style="width:${Math.round(h/totalH*100)}%"></div></div>
      <span class="bar-value">${fmtH(h)}</span>
    </div>`).join('');

  // Por fase
  const porFase = {};
  horasPessoa.forEach(h => {
    if (h.fase) porFase[h.fase] = (porFase[h.fase]||0) + (h.horas||0);
  });
  const faseRows = Object.entries(porFase).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([f,h]) => `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid var(--border)">
      <span style="color:var(--text2)">${f}</span>
      <span style="font-weight:600">${fmtH(h)}</span>
    </div>`).join('');

  return `<div class="drill-title">▸ ${nomeFormatado(pessoa.people)} · ${fmtH(totalH)} no período</div>
  <div class="drill-grid">
    <div>
      <div class="panel-title" style="margin-bottom:8px">Por Projeto</div>
      <div class="chart-bars">${projRows || '<span style="color:var(--text3);font-size:12px">Sem dados</span>'}</div>
    </div>
    <div>
      <div class="panel-title" style="margin-bottom:8px">Por Fase</div>
      ${faseRows || '<span style="color:var(--text3);font-size:12px">Sem dados</span>'}
    </div>
  </div>`;
}

function chipMeta(h, meta) {
  if (h >= meta)        return '<span class="chip chip-green">✓ OK</span>';
  if (h >= meta * 0.75) return '<span class="chip chip-yellow">Parcial</span>';
  if (h > 0)            return '<span class="chip chip-red">Baixo</span>';
  return '<span class="chip chip-gray">—</span>';
}

function carregarEquipes() {
  const salvas = localStorage.getItem(LS_EQUIPES);
  if (salvas) return JSON.parse(salvas);
  // Gera equipes padrão por Role a partir das pessoas carregadas
  return gerarEquipesPadrao();
}

function gerarEquipesPadrao() {
  const pessoas = carregarLS(LS_PESSOAS) || [];
  const porRole = {};
  pessoas.filter(p => p.ativo).forEach(p => {
    if (!p.role) return;
    if (!porRole[p.role]) porRole[p.role] = [];
    porRole[p.role].push(p.people);
  });
  return Object.entries(porRole).map(([role, membros]) => ({
    id:      'eq_' + role.toLowerCase().replace(/\s+/g,'_'),
    nome:    role,
    membros,
    padrao:  true
  }));
}

function salvarEquipes() {
  localStorage.setItem(LS_EQUIPES, JSON.stringify(DB.equipes));
}

function abrirModalEquipes() {
  // Garante equipes atualizadas com pessoas do DB
  if (!DB.equipes.length) DB.equipes = gerarEquipesPadrao();
  renderModalEquipes();
  document.getElementById('modalEquipes').classList.add('open');
}

function fecharModalEquipes() {
  document.getElementById('modalEquipes').classList.remove('open');
}

function renderModalEquipes() {
  // Popula select de pessoas
  const sel = document.getElementById('novaEquipePessoaSelect');
  sel.innerHTML = '<option value="">— Adicionar pessoa —</option>';
  DB.pessoas.filter(p => p.ativo).sort((a,b) => a.people.localeCompare(b.people)).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.people;
    opt.textContent = nomeFormatado(p.people) + (p.role ? ` (${p.role})` : '');
    sel.appendChild(opt);
  });

  document.getElementById('equipesLista').innerHTML = DB.equipes.map((eq, idx) => `
    <div class="equipe-item">
      <div style="flex:1">
        <div class="equipe-nome">${eq.nome} ${eq.padrao ? '<span class="chip chip-gray" style="font-size:10px">padrão</span>' : ''}</div>
        <div class="equipe-membros">${eq.membros.length} membros: ${eq.membros.slice(0,3).map(nomeFormatado).join(', ')}${eq.membros.length>3?' …':''}</div>
      </div>
      <div class="equipe-actions">
        <button class="btn btn-sm" onclick="editarEquipe(${idx})">✎</button>
        <button class="btn btn-sm" onclick="excluirEquipe(${idx})" style="color:var(--red)">✕</button>
      </div>
    </div>`).join('') || '<div style="color:var(--text2);font-size:13px;padding:8px">Nenhuma equipe criada.</div>';
}

let novaEquipeMembros = [];
function adicionarMembroNova() {
  const sel = document.getElementById('novaEquipePessoaSelect');
  const val = sel.value;
  if (!val || novaEquipeMembros.includes(val)) { sel.value = ''; return; }
  novaEquipeMembros.push(val);
  sel.value = '';
  atualizarChipsNova();
}

function removerMembroNova(people) {
  novaEquipeMembros = novaEquipeMembros.filter(m => m !== people);
  atualizarChipsNova();
}

function atualizarChipsNova() {
  document.getElementById('novaEquipeMembros').innerHTML = novaEquipeMembros.map(m =>
    `<span class="member-chip">${nomeFormatado(m)}<button onclick="removerMembroNova('${m}')">×</button></span>`
  ).join('');
}

function salvarNovaEquipe() {
  const nome = document.getElementById('novaEquipeNome').value.trim();
  if (!nome) { toast('Informe o nome da equipe', 'warn'); return; }
  if (!novaEquipeMembros.length) { toast('Adicione pelo menos um membro', 'warn'); return; }
  DB.equipes.push({ id: 'eq_' + Date.now(), nome, membros: [...novaEquipeMembros], padrao: false });
  salvarEquipes();
  novaEquipeMembros = [];
  document.getElementById('novaEquipeNome').value = '';
  atualizarChipsNova();
  popularFiltros();
  renderModalEquipes();
  toast('✓ Equipe criada');
}

function excluirEquipe(idx) {
  if (!confirm('Excluir equipe "' + DB.equipes[idx].nome + '"?')) return;
  DB.equipes.splice(idx, 1);
  salvarEquipes();
  popularFiltros();
  renderModalEquipes();
}

function editarEquipe(idx) {
  const eq = DB.equipes[idx];
  document.getElementById('novaEquipeNome').value = eq.nome;
  novaEquipeMembros = [...eq.membros];
  atualizarChipsNova();
  DB.equipes.splice(idx, 1);
  salvarEquipes();
  renderModalEquipes();
  toast('Edite e clique em "Criar Equipe" para salvar');
}

// ══════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════
function fmtH(h) {
  const hInt = Math.floor(Math.abs(h));
  const min  = Math.round((Math.abs(h) - hInt) * 60);
  return `${hInt}h${min > 0 ? String(min).padStart(2,'0')+'m' : ''}`;
}
function fmtH1d(h) { // compacto para célula de dia
  if (h >= 10) return Math.round(h) + 'h';
  return h.toFixed(1).replace('.0','') + 'h';
}
function fmtISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtData(d) {
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function nomeFormatado(user) {
  if (!user) return '';
  return user.split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
}
function semanaISO(dataStr) {
  if (!dataStr) return 0;
  const d = new Date(dataStr + 'T12:00:00');
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
}
function diasUteisMes(ano, mes) {
  let n = 0;
  const fim = new Date(ano, mes, 0).getDate();
  for (let i = 1; i <= fim; i++) {
    const d = new Date(ano, mes-1, i);
    const dow = d.getDay();
    const iso = fmtISO(d);
    if (dow > 0 && dow < 6 && !FERIADOS.includes(iso)) n++;
  }
  return n;
}
function corPct(pct) {
  if (pct >= 90) return 'green';
  if (pct >= 70) return 'yellow';
  return 'red';
}
function salvarLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
function carregarLS(key)    { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = tipo === 'warn' ? 'var(--yellow)' : 'var(--border)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
